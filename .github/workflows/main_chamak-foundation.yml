# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - chamak-foundation

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          # Next.js 16 emits a one-shot "security reminder" that exits code 1
          # on the first invocation; it continues on retry. Retry once.
          npm run build --if-present || npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: "cc43825d-1d83-497f-8869-f017586cd290"
          tenant-id: "85e77f28-a3b3-4f9b-aeff-2b41a3f34a1f"
          subscription-id: "4140ae21-b7ff-4054-925b-aa2cb81510c4"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chamak-foundation'
          slot-name: 'Production'
          package: .

      - name: 'Disable Oryx build + restart'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            RG=$(az webapp list --query "[?name=='chamak-foundation'].resourceGroup | [0]" -o tsv)
            echo "Resource group: $RG"
            az webapp config appsettings set --name chamak-foundation --resource-group "$RG" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false WEBSITE_RUN_FROM_PACKAGE=0
            az webapp restart --name chamak-foundation --resource-group "$RG"
            echo "Settings applied and restart issued."
