name: Build and deploy Node.js app to Azure Web App - chamak-foundation

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install + build (standalone)
        run: |
          npm install
          # Next.js 16 emits a one-shot "security reminder" that exits code 1 on
          # first invocation; retry once so CI passes.
          npm run build || npm run build

      - name: Assemble standalone deploy package
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          # Persisted data files (will be preserved on first deploy; later deploys
          # should NOT overwrite user uploads — see note below).
          mkdir -p deploy/src/data
          cp -r src/data/. deploy/src/data/
          cp startup.sh deploy/startup.sh
          chmod +x deploy/startup.sh
          # Marker to confirm a given build landed
          cp public/deploy-stamp.txt deploy/deploy-stamp.txt || true
          ls -la deploy | head -30
          test -f deploy/server.js && echo "standalone server.js OK" || (echo "server.js missing!" && exit 1)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: "cc43825d-1d83-497f-8869-f017586cd290"
          tenant-id: "85e77f28-a3b3-4f9b-aeff-2b41a3f34a1f"
          subscription-id: "4140ae21-b7ff-4054-925b-aa2cb81510c4"

      - name: 'Deploy standalone to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chamak-foundation'
          slot-name: 'Production'
          package: deploy
          restart: true

      - name: 'Ensure Oryx disabled + restart'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            RG=$(az webapp list --query "[?name=='chamak-foundation'].resourceGroup | [0]" -o tsv)
            echo "Resource group: $RG"
            az webapp config appsettings set --name chamak-foundation --resource-group "$RG" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false
            az webapp restart --name chamak-foundation --resource-group "$RG"
            echo "Done."
